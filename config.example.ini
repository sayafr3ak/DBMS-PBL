; Copy this file to config.ini and fill in your MySQL password.
; Environment variables PCETS_DB_HOST / PCETS_DB_PORT / PCETS_DB_USER /
; PCETS_DB_PASSWORD / PCETS_DB_NAME (or Clever Cloud's MYSQL_ADDON_*) override these values.
[database]
host = localhost
port = 3306
user = root
password = your-mysql-password
database = police_evidence_db

[app]
secret_key = change-this-secret-key-before-deploying
port = 5000
; the app opens directly as this user (no login page); switch users from the sidebar
default_user = admin
